name: Crew Laravel CI/CD Pipeline

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: "Laravel REST API" # This tells GitHub to use that environment's secrets

    # CI-only environment variables
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: min-lara-react-app
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_EMPLOYEE_PASSWORD: ${{ secrets.SEED_EMPLOYEE_PASSWORD }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: min-lara-react-app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail-fast if secrets are missing
        run: |
          for var in DB_USERNAME DB_PASSWORD SEED_ADMIN_PASSWORD SEED_EMPLOYEE_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              exit 1
            fi
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Wait for MySQL to be ready
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h"$DB_HOST" --silent; do
            echo "Waiting for database..."
            sleep 2
          done

      # Static analysis before tests
      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G || exit 1

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test
