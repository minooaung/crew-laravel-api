name: Crew Laravel CI/CD Pipeline

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: "Laravel REST API"

    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: min-lara-react-app
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_EMPLOYEE_PASSWORD: ${{ secrets.SEED_EMPLOYEE_PASSWORD }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: min-lara-react-app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail-fast if secrets are missing
        run: |
          for var in DB_USERNAME DB_PASSWORD SEED_ADMIN_PASSWORD SEED_EMPLOYEE_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              exit 1
            fi
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Generate Laravel .env
        run: |
          cat <<EOF > .env
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          DB_CONNECTION=mysql
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
          SEED_EMPLOYEE_PASSWORD=${SEED_EMPLOYEE_PASSWORD}
          EOF
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h"$DB_HOST" --silent; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/crew-laravel-api:latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/crew-laravel-api:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/crew-laravel-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/crew-laravel-api:${{ github.sha }}
