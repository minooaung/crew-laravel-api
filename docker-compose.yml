version: "3.8"

services:
    app:
        image: 700800900/crew-laravel-api:latest
        container_name: crew-api
        ports:
            - "8080:80"
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache

    db:
        image: mysql:8.0
        container_name: crew-db
        restart: always
        env_file:
            - .env.docker
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql

    migrate:
        image: 700800900/crew-laravel-api:latest
        depends_on:
            - db
        env_file:
            - .env
        command: php artisan migrate --seed --force
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache

volumes:
    db_data:
