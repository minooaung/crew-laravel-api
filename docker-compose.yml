version: "3.8"

services:
    app:
        image: 700800900/crew-laravel-api:latest
        container_name: crew-api
        ports:
            - "8080:80"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        env_file:
            - .env

    db:
        image: mysql:8.0
        container_name: crew-db
        restart: always
        env_file:
            - .env.docker
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql

    migrate:
        image: 700800900/crew-laravel-api:latest
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        command: >
            sh -c "
            until php -r 'try { new PDO(\"mysql:host=${DB_HOST};port=${DB_PORT};dbname=${DB_DATABASE}\", \"${DB_USERNAME}\", \"${DB_PASSWORD}\"); exit(0);} catch (Exception $e) {exit(1);}'; do
                echo 'Waiting for MySQL to be ready...';
                sleep 5;
            done &&
            php artisan migrate --seed --force
            "

volumes:
    db_data:
